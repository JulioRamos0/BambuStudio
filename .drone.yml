kind: pipeline
type: docker
name: alpine-arm64-build

steps:
  - name: build
    # SHA256 correspondiente a la versión linux/arm64 (aarch64) de alpine:latest
    image: alpine@sha256:e7a1a92a5bfeee40966aea60f0796b0e7917cc35591542701834f03a68fa3d18
    pull: if-not-exists
    environment:
      # Limit parallel jobs to prevent Out of Memory errors on Termux/mobile devices
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    commands:
      - apk update
      - apk add --no-cache bash sudo coreutils
      # -u installs dependencies via linux.d/alpine
      - bash ./BuildLinux.sh -u
      # -d builds dependencies, -s builds bambu-studio
      # -r skips memory check (often fails in Termux/containers)
      # -f disables automatic parallel limit calculation, respecting CMAKE_BUILD_PARALLEL_LEVEL
      - bash ./BuildLinux.sh -ds -r -f
