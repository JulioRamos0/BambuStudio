kind: pipeline
type: docker
name: ubuntu-arm64-build

platform:
  os: linux
  arch: arm64

steps:
  - name: build
    image: ubuntu:22.04
    pull: if-not-exists
    environment:
      CMAKE_BUILD_PARALLEL_LEVEL: 1
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update -y
      - apt-get install -y bash sudo coreutils tzdata
      # -u installs dependencies via linux.d/ubuntu
      - bash ./BuildLinux.sh -u
      # -d builds dependencies, -s builds bambu-studio
      # -r skips memory check (often fails in Termux/containers)
      # -1 limits builds to 1 core to prevent RAM saturation (OOM kills)
      - bash ./BuildLinux.sh -ds -r -1
